<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbfcfe" />
    <meta
      name="description"
      content="A dependable task manager built on portable Markdown records."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskNotes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.png" />
    <link rel="icon" href="%BASE_URL%tasknotes-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("mdbase:theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1b1d23"
          : "#fbfcfe";
      } catch {}
    </script>
    <title>TaskNotes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
