<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fffefd" />
    <meta
      name="description"
      content="A dependable task manager built on portable Markdown records."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskNotes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.png" />
    <link rel="icon" href="%BASE_URL%tasknotes-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("mdbase:theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1c1a17"
          : "#fffefd";
      } catch {}
    </script>
    <title>TaskNotes</title>
  </head>
  <body>
    <!-- First paint before any script runs: the starting screen the shared
         collection gate renders next, without its sentence (interface copy is
         translated in the app). React replaces it. Kept in step with the gate
         by src/app/static-shell.test.tsx. -->
    <div id="root">
      <main
        class="mdbase-collections mdbase-collections-gate"
        data-layout="page"
        data-phase="starting"
        aria-busy="true"
      >
        <div class="mdbase-collections-gate-body">
          <div class="mdbase-opening" data-loading-state="opening">
            <div class="mdbase-opening-message">
              <span class="wordmark"
                ><span class="wordmark-mark" aria-hidden="true"
                  ><img alt="" src="%BASE_URL%tasknotes-mark.svg" /></span
                ><span class="wordmark-label">TaskNotes</span></span
              >
              <div><p>&nbsp;</p></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
