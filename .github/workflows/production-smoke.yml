name: Production smoke

on:
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasknotes-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build pull request application
        if: github.event_name == 'pull_request'
        run: pnpm build:e2e
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_APP_URL: http://127.0.0.1:4173/tasknotes-app
          TASKNOTES_WEB_ONLY: "1"

      - name: Check pull request artifact
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/tasknotes-app/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "The pull request preview did not become ready." >&2
            exit 1
          fi

          pnpm test:production-smoke
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_PRODUCTION_URL: http://127.0.0.1:4173/tasknotes-app
          TASKNOTES_REQUIRE_CONNECT_MANIFEST_VALIDATION: "0"

      - name: Run desktop browser integration
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e --project=desktop
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/tasknotes-app/
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
          VITE_BASE_PATH: /tasknotes-app/

      - name: Check production boundaries
        if: github.event_name != 'pull_request'
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: https://app.tasknotes.dev
