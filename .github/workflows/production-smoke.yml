name: Production smoke

on:
  pull_request:
    paths:
      - ".github/workflows/production-smoke.yml"
      - "scripts/production-smoke.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasknotes-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production boundaries
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: ${{ vars.TASKNOTES_PRODUCTION_URL || 'https://callumalpass.github.io/tasknotes-app' }}
          # Pull requests inspect the currently deployed base revision. The
          # Pages workflow performs the strict notification-manifest check
          # after it deploys main.
          TASKNOTES_REQUIRE_NOTIFICATION_MANIFEST: ${{ github.event_name == 'pull_request' && '0' || '1' }}
