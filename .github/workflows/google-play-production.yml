name: Google Play production

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful main-source Android build run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: google-play-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: evidence
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: mdbase-cloud-ops,mdbase-connect
          permission-contents: read
          permission-actions: write
      - id: recheck
        name: Recheck source, SDK, stops and review under the Play edit lock
        env:
          GH_TOKEN: ${{ github.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/mobile-release-policy.mjs android
      - name: Download and authenticate exact signed artifact archive
        if: env.STORE_PENDING != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-mobile-build.mjs
      - name: Submit production to everyone on approval
        if: env.STORE_PENDING != 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          TASKNOTES_ANDROID_VERSION_CODE_BASE: ${{ vars.TASKNOTES_ANDROID_VERSION_CODE_BASE }}
        run: node scripts/publish-google-play.mjs --qualified
      # A recheck refusal retains its bounded pre-write receipt; any later
      # failure uploads nothing, so the parent cannot read it as pre-write.
      - if: success() || steps.recheck.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-target-result
          path: store-target-result.json
          retention-days: 90
          if-no-files-found: error
