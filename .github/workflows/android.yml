name: Android

on:
  # PRs to the next branch rely on local `pnpm verify`; full checks run for main.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      native_qualification:
        description: Run the registered-account debug journey (not signed proof)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Firebase configuration
        run: |
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi

      - name: Configure Firebase for Android
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Verify web application and committed catalogues
        if: github.event_name != 'workflow_dispatch' || !inputs.native_qualification
        run: pnpm verify && git diff --exit-code -- src/i18n/locales

      - name: Build assets for manual debug-only harness iteration
        if: github.event_name == 'workflow_dispatch' && inputs.native_qualification
        run: |
          test "$GITHUB_REF" = refs/heads/draft/android-native-wasm-host
          pnpm build

      - name: Sync native project
        run: pnpm exec cap sync android

      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Compile release test-host variant without release credentials
        working-directory: android
        env:
          TASKNOTES_ANDROID_TEST_BUILD_TYPE: release
        run: ./gradlew :app:assembleReleaseAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  native-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          id
          test -r /dev/kvm && test -w /dev/kvm

  native-emulator-preflight:
    needs: [build, native-kvm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: tasknotes-android-debug-${{ github.sha }}
          path: native-apks
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise real Chrome and application WebView without credentials
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
            adb install native-apks/debug/app-debug.apk
            adb install native-apks/androidTest/debug/app-debug-androidTest.apk
            timeout 240s node scripts/android-emulator-preflight.mjs
      - name: Retain public pre-sign-in startup failure screenshot
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-native-preflight
          path: native-preflight.png
          if-no-files-found: warn

  native-debug-journey:
    if: github.event_name == 'workflow_dispatch' && inputs.native_qualification && github.ref == 'refs/heads/draft/android-native-wasm-host'
    needs: [build, native-emulator-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-native-qualification
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: tasknotes-android-debug-${{ github.sha }}
          path: native-apks
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercise sign-in, task CRUD, SQLite reopen and owned cleanup
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TASKNOTES_NATIVE_ACCOUNT: ${{ secrets.TASKNOTES_NATIVE_ACCOUNT }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
            adb install native-apks/debug/app-debug.apk
            adb install native-apks/androidTest/debug/app-debug-androidTest.apk
            timeout 900s node scripts/run-android-wasm-journey.mjs
      - name: Retain bounded journey result (never signed qualification)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-debug-journey
          path: journey.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, native-emulator-preflight]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.signed_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed_artifact.outputs.artifact-digest }}
      host_id: ${{ steps.test_host.outputs.artifact-id }}
      host_digest: ${{ steps.test_host.outputs.artifact-digest }}
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Validate release metadata and signing configuration
        id: release_metadata
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          version_name="${GITHUB_REF_NAME#android-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version_name" != "$package_version" ]; then
            echo "Tag version $version_name does not match package.json version $package_version." >&2
            exit 1
          fi
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Android release tag must contain a semantic version." >&2
            exit 1
          fi

          version_code_base="${{ vars.TASKNOTES_ANDROID_VERSION_CODE_BASE }}"
          if ! [[ "$version_code_base" =~ ^[0-9]+$ ]]; then
            echo "TASKNOTES_ANDROID_VERSION_CODE_BASE must be a non-negative integer." >&2
            exit 1
          fi
          version_code="$((version_code_base + GITHUB_RUN_NUMBER))"
          if [ "$version_code" -lt 1 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "Generated Android version code is outside the platform range." >&2
            exit 1
          fi
          echo "TASKNOTES_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "TASKNOTES_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Restore signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tasknotes-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tasknotes-release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies and sync native project
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          pnpm build
          pnpm exec cap sync android

      - name: Build signed Android release and same-identity test host
        working-directory: android
        env:
          TASKNOTES_ANDROID_TEST_BUILD_TYPE: release
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleReleaseAndroidTest --stacktrace

      - name: Upload signed artifacts
        id: signed_artifact
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Retain same-source signed test host (not shipping application)
        id: test_host
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-test-host-${{ github.sha }}
          path: android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tasknotes-release.jks"
          rm -f android/app/google-services.json

  native-signed-qualification:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-native-qualification
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Require hardware acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Qualify retained same-run signed artifact bytes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          SIGNED_ARTIFACT_DIGEST: ${{ needs.release.outputs.artifact_digest }}
          TEST_HOST_ARTIFACT_ID: ${{ needs.release.outputs.host_id }}
          TEST_HOST_ARTIFACT_DIGEST: ${{ needs.release.outputs.host_digest }}
          TASKNOTES_NATIVE_ACCOUNT: ${{ secrets.TASKNOTES_NATIVE_ACCOUNT }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: |
            "$ANDROID_HOME/emulator/emulator" -accel-check
            timeout 900s node scripts/qualify-android-signed-artifact.mjs
      - name: Retain passing artifact-bound wasm qualification
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-mobile-wasm-android
          path: qualification.json
          if-no-files-found: error
      - name: Retain bounded qualification failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-native-failure
          path: native-qualification-failure.json
          if-no-files-found: warn
