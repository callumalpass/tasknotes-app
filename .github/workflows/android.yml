name: Android

on:
  # PRs to the next branch rely on local `pnpm verify`; full checks run for main.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Firebase configuration
        run: |
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi

      - name: Configure Firebase for Android
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Verify web application and committed catalogues
        run: pnpm verify && git diff --exit-code -- src/i18n/locales

      - name: Sync native project
        run: pnpm exec cap sync android

      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scope ops-line and Connect evidence access
        id: evidence
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: mdbase-cloud-ops,mdbase-connect
          permission-contents: read
          permission-actions: write

      - name: Qualify exact main source before dependency execution
        env:
          GH_TOKEN: ${{ github.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STORE_VERSION: ${{ inputs.version }}
        run: node scripts/store-cd.mjs build android

      - name: Retain immutable build source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-build-source-android
          path: mobile-build-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Check out qualified build source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Validate release metadata and signing configuration
        id: release_metadata
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          version_name="$TASKNOTES_STORE_VERSION"
          if ! [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Android release tag must contain a semantic version." >&2
            exit 1
          fi

          version_code_base="${{ vars.TASKNOTES_ANDROID_VERSION_CODE_BASE }}"
          if ! [[ "$version_code_base" =~ ^[0-9]+$ ]]; then
            echo "TASKNOTES_ANDROID_VERSION_CODE_BASE must be a non-negative integer." >&2
            exit 1
          fi
          version_code="$((version_code_base + GITHUB_RUN_NUMBER))"
          if [ "$version_code" -lt 1 ] || [ "$version_code" -gt 2100000000 ]; then
            echo "Generated Android version code is outside the platform range." >&2
            exit 1
          fi
          echo "TASKNOTES_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "TASKNOTES_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Restore signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tasknotes-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tasknotes-release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies and sync native project
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          pnpm verify
          pnpm exec cap sync android

      - name: Build signed Android release
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-${{ inputs.source_sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tasknotes-release.jks"
          rm -f android/app/google-services.json
