name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Firebase configuration
        run: |
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi

      - name: Configure Firebase for Android
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Verify web application and contracts
        run: pnpm verify

      - name: Sync native project
        run: pnpm exec cap sync android

      - name: Test, lint, and build debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TASKNOTES_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate signing configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "TASKNOTES_ANDROID_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tasknotes-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tasknotes-release.jks" >> "$GITHUB_ENV"

      - name: Install dependencies and sync native project
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "TASKNOTES_FIREBASE_PROJECT_ID requires GOOGLE_SERVICES_JSON_BASE64." >&2
            exit 1
          fi
          if [ -z "$TASKNOTES_FIREBASE_PROJECT_ID" ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 requires TASKNOTES_FIREBASE_PROJECT_ID." >&2
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          pnpm build
          pnpm exec cap sync android

      - name: Build signed Android release
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tasknotes-android-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --generate-notes \
            --title "TaskNotes ${TASKNOTES_ANDROID_VERSION_NAME}"
