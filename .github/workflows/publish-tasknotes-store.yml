name: Publish TaskNotes store target
run-name: "TaskNotes store: ${{ inputs.target }}"

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [google-play, app-store]
      source_sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tasknotes-store-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    environment: ${{ inputs.target == 'google-play' && 'google-play-production' || 'app-store-production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: callumalpass
          repositories: tasknotes-app
          permission-contents: read
          permission-actions: write
      - id: evidence
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: mdbase-cloud-ops,mdbase-connect
          permission-contents: read
          permission-actions: write
      - name: Reconcile review, build and submit once
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
          STORE_TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: node scripts/store-cd.mjs
      - name: Retain target outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tasknotes-store-${{ inputs.target }}-${{ github.run_id }}
          path: store-cd-result.json
          retention-days: 90
          if-no-files-found: error
