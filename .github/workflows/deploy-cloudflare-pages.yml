name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.CLOUDFLARE_PAGES_ENABLED == '1'
    environment:
      name: cloudflare-pages
      url: https://app.tasknotes.dev/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify application
        run: pnpm format:check && pnpm typecheck && pnpm lint && pnpm test && pnpm test:conformance

      - name: Build Cloudflare Pages application
        run: pnpm build
        env:
          VITE_BASE_PATH: /
          TASKNOTES_APP_URL: https://app.tasknotes.dev
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Test Cloudflare Pages artifact
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
          VITE_BASE_PATH: /

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tasknotes-app --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.114.0"

      - name: Smoke production domain
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: https://app.tasknotes.dev
