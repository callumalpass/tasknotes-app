name: iOS

on:
  # PRs to the next branch rely on local `pnpm verify`; full checks run for main.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests build a production-configured candidate that is never
      # releasable while the production trust pin is absent. Pushes and
      # manual runs keep the full, fail-closed production build.
      - name: Verify web application and contracts
        run: pnpm ${{ github.event_name == 'pull_request' && 'verify:candidate' || 'verify' }}

      - name: Sync iOS project
        run: pnpm exec cap sync ios

      - name: Build iOS simulator application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
