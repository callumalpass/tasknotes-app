name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify application
        run: pnpm format:check && pnpm typecheck && pnpm lint && pnpm test && pnpm test:conformance

      - name: Build GitHub Pages test application
        run: pnpm build:e2e
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_APP_URL: https://callumalpass.github.io/tasknotes-app
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Test GitHub Pages artifact
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/tasknotes-app/
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
          VITE_BASE_PATH: /tasknotes-app/

      - name: Build GitHub Pages production application
        run: pnpm build
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_APP_URL: https://callumalpass.github.io/tasknotes-app
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke deployed Pages
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: https://callumalpass.github.io/tasknotes-app

  deploy-cloudflare:
    if: vars.CLOUDFLARE_PAGES_ENABLED == '1'
    needs: deploy
    environment:
      name: cloudflare-pages
      url: https://app.tasknotes.dev/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Pages application
        run: pnpm build
        env:
          VITE_BASE_PATH: /
          TASKNOTES_APP_URL: https://app.tasknotes.dev
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Verify Cloudflare Pages manifest
        run: node -e 'const manifest = require("./dist/.well-known/mdbase-app.json"); if (manifest.homepage !== "https://app.tasknotes.dev/" || manifest.redirect_uris?.[0] !== "https://app.tasknotes.dev/auth/mdbase/callback" || manifest.redirect_uris?.length !== 1) process.exit(1)'

      - name: Deploy Cloudflare Pages
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy dist --project-name=tasknotes-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke production domain
        if: vars.TASKNOTES_PRODUCTION_URL != ''
        run: pnpm test:production-smoke
        env:
          TASKNOTES_PRODUCTION_URL: ${{ vars.TASKNOTES_PRODUCTION_URL }}
