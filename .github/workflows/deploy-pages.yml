name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publisher:
        description: Legacy main route or protected native release route
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - native
      source_sha:
        description: Native only - exact full SHA at the authorized native release head
        required: false
        type: string
      target:
        description: Deployment target (validate staging before production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# Hold the lock through the smoke checks. Never cancel a live production deploy.
concurrency:
  group: tasknotes-pages-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    # Legacy main/GitHub Pages route remains unchanged; native never enters it.
    if: inputs.publisher != 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Pages deployments only run from main (got ${GITHUB_REF})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify application
        run: pnpm format:check && pnpm typecheck && pnpm lint && pnpm test && pnpm test:conformance

      - name: Build GitHub Pages test application
        run: pnpm build:e2e
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_APP_URL: https://callumalpass.github.io/tasknotes-app
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Test GitHub Pages artifact
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/tasknotes-app/
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
          VITE_BASE_PATH: /tasknotes-app/

  deploy-staging:
    if: inputs.publisher != 'native' && (github.event_name == 'push' || inputs.target == 'staging')
    needs: verify
    environment:
      name: tasknotes-staging
      url: https://staging.tasknotes-app.pages.dev/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::tasknotes-staging needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Existing script builds/validates staging URLs and smokes staging Connect.
      - name: Deploy and smoke staging
        run: pnpm deploy:dev
        env:
          MDBASE_ENV: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    if: inputs.publisher != 'native' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages production application
        run: pnpm build
        env:
          VITE_BASE_PATH: /tasknotes-app/
          TASKNOTES_APP_URL: https://callumalpass.github.io/tasknotes-app
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0

      - name: Smoke deployed Pages
        run: |
          pnpm test:production-smoke || {
            echo "::error::GitHub Pages was deployed but its production smoke failed. Investigate before promoting Cloudflare."
            exit 1
          }
        env:
          TASKNOTES_PRODUCTION_URL: https://callumalpass.github.io/tasknotes-app

  deploy-cloudflare:
    if: inputs.publisher != 'native' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: deploy
    environment:
      name: cloudflare-pages
      url: https://app.tasknotes.dev/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::cloudflare-pages needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Pages application
        run: pnpm build
        env:
          VITE_BASE_PATH: /
          TASKNOTES_APP_URL: https://app.tasknotes.dev
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Verify Cloudflare Pages manifest
        run: node -e 'const manifest = require("./dist/.well-known/mdbase-app.json"); if (manifest.homepage !== "https://app.tasknotes.dev/" || manifest.redirect_uris?.[0] !== "https://app.tasknotes.dev/auth/mdbase/callback" || manifest.redirect_uris?.length !== 1) process.exit(1)'

      - name: Deploy Cloudflare Pages
        run: pnpm dlx wrangler@4.114.0 pages deploy dist --project-name=tasknotes-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Mandatory after EVERY successful production deploy; not variable-gated.
      - name: Smoke production domain
        run: |
          pnpm test:production-smoke || {
            echo "::error::app.tasknotes.dev was deployed but its production smoke failed. Production may be unhealthy; investigate or roll back."
            exit 1
          }
        env:
          TASKNOTES_PRODUCTION_URL: https://app.tasknotes.dev

  # Native source NEVER merges to main. The production Pages --branch=main
  # below selects a Pages slot only, not a Git source branch.
  native-request:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse arbitrary refs, stale SHAs and non-native dispatches before checkout
        env:
          NATIVE_TARGET: ${{ inputs.target }}
          NATIVE_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$NATIVE_TARGET:$GITHUB_REF" in
            staging:refs/heads/release/native-staging|production:refs/heads/release/native-production) ;;
            *) echo '::error::Native dispatch requires the literal target release branch.'; exit 1 ;;
          esac
          if [[ ! "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$NATIVE_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Native source must be the exact full dispatch workflow SHA.'
            exit 1
          fi

  native-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher == 'native'
    needs: native-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Coordinator must configure exact native ref policies on both environments.
    # Production requires Callum review, no bypass, and a separate cutover GO.
    # No credentials are supplied to checkout, install, guard or build steps.
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'staging' && 'https://staging.tasknotes-app.pages.dev/' || 'https://app.tasknotes.dev/' }}
    env:
      NATIVE_TARGET: ${{ inputs.target }}
      NATIVE_SOURCE_SHA: ${{ inputs.source_sha }}
      # Public original archive hashes, independently approved by the SDK
      # custodian and installed as protected target-environment variables.
      # Missing values refuse. They must NOT be inferred from app companions.
      NATIVE_SDK_SHA256: ${{ vars.NATIVE_SDK_SHA256 }}
      NATIVE_UI_SHA256: ${{ vars.NATIVE_UI_SHA256 }}
      NATIVE_PROTOCOL_SHA256: ${{ vars.NATIVE_PROTOCOL_SHA256 }}
    steps:
      - name: Check out only the requested immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Place receipt outside the clean source checkout
        run: echo "NATIVE_RECEIPT_PATH=$RUNNER_TEMP/tasknotes-native/receipt.json" >> "$GITHUB_ENV"

      - name: Verify exact authorized native head, clean tree and authenticated target SDK before install
        run: node scripts/native-publisher.mjs guard

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Test publisher refusal and served-byte contracts
        run: node --test scripts/native-publisher.node-test.mjs
      - name: Build once, strictly validate and inventory exact native bytes
        run: node scripts/native-publisher.mjs prepare

      - name: Publish existing bytes and verify actual target alias or custom domain
        run: node scripts/native-publisher.mjs publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      # Preserve failed receipts too. Never automatically rebuild/redeploy/rollback.
      - name: Retain native receipt and structured deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasknotes-native-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tasknotes-native/
          if-no-files-found: warn
          retention-days: 90
