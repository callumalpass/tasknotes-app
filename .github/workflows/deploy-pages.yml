name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publisher:
        description: Legacy main route or protected native release route
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - native
      source_sha:
        description: Native only - exact full SHA at the authorized native release head
        required: false
        type: string
      target:
        description: Deployment target (validate staging before production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# Hold the lock through the smoke checks. Never cancel a live production deploy.
concurrency:
  group: tasknotes-pages-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    # Main route verification; native has its own build below.
    if: inputs.publisher != 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Pages deployments only run from main (got ${GITHUB_REF})."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm i18n:check && git diff --exit-code -- src/i18n/locales && pnpm format:check && pnpm typecheck && pnpm lint && pnpm test && pnpm test:conformance

  deploy-staging:
    if: inputs.publisher != 'native' && (github.event_name == 'push' || inputs.target == 'staging')
    needs: verify
    environment:
      name: tasknotes-staging
      url: https://staging.tasknotes-app.pages.dev/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::tasknotes-staging needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Existing script builds/validates staging URLs and smokes staging Connect.
      - name: Deploy and smoke staging
        run: pnpm deploy:dev
        env:
          MDBASE_ENV: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cloudflare:
    if: inputs.publisher != 'native' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs: verify
    environment:
      name: cloudflare-pages
      url: https://app.tasknotes.dev/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::cloudflare-pages needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Cloudflare Pages application
        run: pnpm build
        env:
          VITE_BASE_PATH: /
          TASKNOTES_APP_URL: https://app.tasknotes.dev
          TASKNOTES_WEB_ONLY: "1"
          TASKNOTES_FIREBASE_PROJECT_ID: ${{ vars.TASKNOTES_FIREBASE_PROJECT_ID }}

      - name: Verify Cloudflare Pages manifest
        run: node -e 'const manifest = require("./dist/.well-known/mdbase-app.json"); if (manifest.homepage !== "https://app.tasknotes.dev/" || manifest.redirect_uris?.[0] !== "https://app.tasknotes.dev/auth/mdbase/callback" || manifest.redirect_uris?.length !== 1) process.exit(1)'

      - name: Deploy Cloudflare Pages
        run: pnpm dlx wrangler@4.114.0 pages deploy dist --project-name=tasknotes-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Mandatory after EVERY successful production deploy; not variable-gated.
      - name: Smoke production domain
        run: |
          pnpm test:production-smoke || {
            echo "::error::app.tasknotes.dev was deployed but its production smoke failed. Production may be unhealthy; investigate or roll back."
            exit 1
          }
        env:
          TASKNOTES_PRODUCTION_URL: https://app.tasknotes.dev

  # Native source NEVER merges to main. The production Pages --branch=main
  # below selects a Pages slot only, not a Git source branch.
  native-request:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse arbitrary refs, stale SHAs and non-native dispatches before checkout
        env:
          NATIVE_TARGET: ${{ inputs.target }}
          NATIVE_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$NATIVE_TARGET:$GITHUB_REF" in
            staging:refs/heads/release/native-staging|production:refs/heads/release/native-production) ;;
            *) echo '::error::Native dispatch requires the literal target release branch.'; exit 1 ;;
          esac
          if [[ ! "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$NATIVE_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Native source must be the exact full dispatch workflow SHA.'
            exit 1
          fi

  # This job has NO GitHub environment and NO Cloudflare credentials.
  native-build:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher == 'native'
    needs: native-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    env:
      NATIVE_TARGET: ${{ inputs.target }}
      NATIVE_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify originals, reviewed target intake and frozen lock BEFORE SDK code
        id: originals
        run: node scripts/native-publisher.mjs guard
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Frozen unprivileged install without hooks
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind EVERY installed original BEFORE any candidate SDK execution
        id: installed
        run: node scripts/native-publisher.mjs guard-installed
      - name: Check source contracts
        id: contracts
        run: pnpm test:release
      - name: Check EVERY installed original, then build ONCE and inventory final offline shell
        id: prepare
        run: node scripts/native-publisher.mjs prepare
        env:
          NATIVE_ARTIFACT_PATH: ${{ runner.temp }}/tasknotes-native-build
      - name: Retain immutable final upload bytes including ALL hidden/control files
        id: artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasknotes-native-build-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tasknotes-native-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # Separate public FAILURE data; never the qualified artifact output above.
      - name: Record public unprivileged build failure
        if: failure()
        run: node scripts/native-build-failure.mjs
        env:
          NATIVE_FAILURE_PATH: ${{ runner.temp }}/tasknotes-native-build-failure
          NATIVE_ORIGINALS_OUTCOME: ${{ steps.originals.outcome }}
          NATIVE_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          NATIVE_INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
          NATIVE_CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          NATIVE_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
      - name: Retain public build-failure-only receipt independently of skipped publisher
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasknotes-native-build-failure-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tasknotes-native-build-failure/receipt.json
          if-no-files-found: warn
          retention-days: 90

  native-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher == 'native' && needs.native-build.result == 'success'
    needs: [native-request, native-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # EXTERNAL policy: legacy main + exact authorized native target ref.
    # Production requires Callum reviewer/no admin bypass (NOT prevent-self-review).
    # Separate Callum GO before production dispatch/tag/upload; UI approval ONLY.
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'staging' && 'https://staging.tasknotes-app.pages.dev/' || 'https://app.tasknotes.dev/' }}
    env:
      NATIVE_TARGET: ${{ inputs.target }}
      NATIVE_SOURCE_SHA: ${{ inputs.source_sha }}
      NATIVE_ARTIFACT_ID: ${{ needs.native-build.outputs.artifact-id }}
      NATIVE_ARTIFACT_DIGEST: ${{ needs.native-build.outputs.artifact-digest }}
      # ONCE OFF-CI private Ops auth by NX-TRUST/TNAPP; CI binds ORIGINAL bytes.
      NATIVE_SDK_SHA256: ${{ vars.NATIVE_SDK_SHA256 }}
      NATIVE_UI_SHA256: ${{ vars.NATIVE_UI_SHA256 }}
      NATIVE_PROTOCOL_SHA256: ${{ vars.NATIVE_PROTOCOL_SHA256 }}
      NATIVE_TRUST_ASSET_SHA256: ${{ vars.NATIVE_TRUST_ASSET_SHA256 }}
    steps:
      - name: Check out reviewed uploader source, NEVER artifact project scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.7.0
          run_install: false
      - name: Install ONLY independently locked official Wrangler, no workspace/config/hooks
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/tasknotes-publish-tooling"
          mkdir -p "$tool" "$RUNNER_TEMP/tasknotes-tool-home"
          cp scripts/native-publish-tooling/package.json scripts/native-publish-tooling/pnpm-lock.yaml "$tool/"
          touch "$tool/empty-user.npmrc" "$tool/empty-global.npmrc"
          cd "$tool"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/tasknotes-tool-home" CI=true \
            npm_config_userconfig="$tool/empty-user.npmrc" \
            npm_config_globalconfig="$tool/empty-global.npmrc" \
            pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace \
            --config.registry=https://registry.npmjs.org
      - name: Validate immutable artifact, assert bytes/current native HEAD, ONE upload and capture UUID
        id: native_upload
        run: node scripts/native-publisher-upload.mjs upload
        env:
          NATIVE_EVIDENCE_PATH: ${{ runner.temp }}/tasknotes-native-evidence
          NATIVE_WRANGLER_PATH: ${{ runner.temp }}/tasknotes-publish-tooling/node_modules/wrangler/bin/wrangler.js
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify actual served bytes and trusted hosting ONLY after captured deployment UUID
        if: steps.native_upload.outcome == 'success' && steps.native_upload.outputs.deployment_id != ''
        run: node scripts/native-publisher-upload.mjs verify
        env:
          NATIVE_EVIDENCE_PATH: ${{ runner.temp }}/tasknotes-native-evidence
          NATIVE_DEPLOYMENT_ID: ${{ steps.native_upload.outputs.deployment_id }}
      - name: Retain failed receipt, immutable artifact and source/run/deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasknotes-native-evidence-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tasknotes-native-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
