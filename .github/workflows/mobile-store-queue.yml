name: Mobile store queue

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            environment: google-play-production
          - platform: ios
            environment: app-store-production
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    timeout-minutes: 60
    concurrency:
      group: mobile-store-queue-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      TASKNOTES_PLAY_AUTOMATION_ENABLED: ${{ vars.TASKNOTES_PLAY_AUTOMATION_ENABLED }}
      TASKNOTES_APP_STORE_AUTOMATION_ENABLED: ${{ vars.TASKNOTES_APP_STORE_AUTOMATION_ENABLED }}
      TASKNOTES_ANDROID_VERSION_CODE_BASE: ${{ vars.TASKNOTES_ANDROID_VERSION_CODE_BASE }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Scope release App to the personal-account repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: callumalpass
          repositories: tasknotes-app
          permission-contents: read
          permission-actions: write
      - name: Scope ops-line and Connect evidence access separately
        id: evidence
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: |
            mdbase-cloud-ops
            mdbase-connect
          permission-contents: read
          permission-actions: write
      - name: Select newest qualified green main (read-only stores)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
        run: node scripts/mobile-store-queue.mjs ${{ matrix.platform }}
      - name: Retain decision before any submission dispatch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-store-plan-${{ matrix.platform }}
          path: mobile-store-plan.json
          retention-days: 90
          if-no-files-found: error
      - name: Recheck and dispatch only an enabled unblocked candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
        run: node scripts/mobile-store-dispatch.mjs ${{ matrix.platform }}
      - name: Retain bounded attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-store-attempt-${{ matrix.platform }}
          path: mobile-store-attempt.json
          retention-days: 90
          if-no-files-found: warn
