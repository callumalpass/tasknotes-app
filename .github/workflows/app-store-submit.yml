name: App Store submission

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful main-source iOS build run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: app-store-production
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: app-store-production
      url: https://appstoreconnect.apple.com/apps/6797168033/distribution
    steps:
      - name: Check out approved release policy and metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify source workflow and resolve exact uploaded build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          node scripts/app-store-source-run.mjs

      - name: Scope ops-line and Connect evidence access
        id: evidence
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: |
            mdbase-cloud-ops
            mdbase-connect
          permission-contents: read
          permission-actions: write

      - name: Enforce shared source, SDK, hold and review gates
        env:
          GH_TOKEN: ${{ github.token }}
          APP_EVIDENCE_GH_TOKEN: ${{ steps.evidence.outputs.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          APP_STORE_PUBLISH_KEY_ID: ${{ vars.APP_STORE_PUBLISH_KEY_ID }}
          APP_STORE_PUBLISH_ISSUER_ID: ${{ vars.APP_STORE_PUBLISH_ISSUER_ID }}
          APP_STORE_PUBLISH_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_PUBLISH_PRIVATE_KEY_BASE64 }}
        run: node scripts/mobile-release-policy.mjs ios

      - name: Test publication policy
        run: node --test scripts/submit-app-store.node-test.mjs scripts/app-store-source-run.node-test.mjs

      - name: Check or submit the public release
        if: env.STORE_PENDING != 'true'
        env:
          APP_STORE_PUBLISH_KEY_ID: ${{ vars.APP_STORE_PUBLISH_KEY_ID }}
          APP_STORE_PUBLISH_ISSUER_ID: ${{ vars.APP_STORE_PUBLISH_ISSUER_ID }}
          APP_STORE_PUBLISH_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_PUBLISH_PRIVATE_KEY_BASE64 }}
          APP_REVIEW_DEMO_ACCOUNT_NAME: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_NAME }}
          APP_REVIEW_DEMO_ACCOUNT_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_ACCOUNT_PASSWORD }}
        run: node scripts/submit-app-store.mjs --submit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-target-result
          path: store-target-result.json
          retention-days: 90
          if-no-files-found: error
